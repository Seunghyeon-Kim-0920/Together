<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071b3a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Offline · Together</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f4ee; color: #071b3a; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); text-align: center; background: #fff; border: 1px solid #dedbd4; border-radius: 24px; padding: 36px 28px; box-shadow: 0 18px 50px rgb(7 27 58 / 10%); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 22px 0 10px; font-size: 1.65rem; }
      p { margin: 0; color: #526079; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>연결이 필요합니다</h1>
      <p>인터넷 연결을 확인한 뒤 Together를 다시 열어 주세요.<br />Reconnect to continue planning your trip.</p>
    </main>
  </body>
</html>
